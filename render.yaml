services:
  - type: web
    name: titledesk
    runtime: static
    repo: https://github.com/spencerandtheteagues/titledesk-site
    branch: main
    buildCommand: "true"
    staticPublishPath: .
    domains:
      - title-desk.com
      - www.title-desk.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://titledesk-licensing.theharnesslab.workers.dev; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    routes:
      - type: rewrite
        source: /download
        destination: /download/index.html
      - type: rewrite
        source: /thanks
        destination: /thanks/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
